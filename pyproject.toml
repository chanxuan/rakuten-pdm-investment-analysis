[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "household-cash-allocation"
version = "0.1.0"
description = "Expense quantile forecasting and cash-constrained monthly allocation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
extended = ["lightgbm==4.6.0", "torch>=2.4,<3"]
dev = ["pytest>=8,<10", "ruff==0.17.3"]

[project.scripts]
household-cashflow = "household_cashflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["extended: requires LightGBM and PyTorch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
